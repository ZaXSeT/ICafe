name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./mobile-app
        run: |
          npm install
          npx expo install --fix
          npm install @expo/metro-config

      - name: Create .env file
        working-directory: ./mobile-app
        run: |
          echo "EXPO_PUBLIC_FIREBASE_API_KEY=AIzaSyAl50PUxncpZd3FCKrxoSznr3bmQSBPtrk" >> .env
          echo "EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=icafe-add1f.firebaseapp.com" >> .env
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID=icafe-add1f" >> .env
          echo "EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=icafe-add1f.firebasestorage.app" >> .env
          echo "EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=534641100622" >> .env
          echo "EXPO_PUBLIC_FIREBASE_APP_ID=1:534641100622:web:e01ac1b3e3fafdfc31401f" >> .env

      - name: Prebuild Android
        working-directory: ./mobile-app
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyAl50PUxncpZd3FCKrxoSznr3bmQSBPtrk
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: icafe-add1f.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: icafe-add1f
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: icafe-add1f.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 534641100622
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:534641100622:web:e01ac1b3e3fafdfc31401f

      - name: Build APK
        working-directory: ./mobile-app/android
        run: ./gradlew assembleRelease
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: AIzaSyAl50PUxncpZd3FCKrxoSznr3bmQSBPtrk
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: icafe-add1f.firebaseapp.com
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: icafe-add1f
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: icafe-add1f.firebasestorage.app
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 534641100622
          EXPO_PUBLIC_FIREBASE_APP_ID: 1:534641100622:web:e01ac1b3e3fafdfc31401f

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          body: |
            Automatically built Expo APK from the latest commit.
            Download and install on your Android device.
          files: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
